<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyxs</title>
    <style>
      /* Fondo oscuro inmediato para evitar el flash blanco del WebView al abrir */
      html, body { margin: 0; background: #1f1e1d; }
      html.nyxs-quick, html.nyxs-quick body { background: transparent; }
      html.nyxs-quick #nyxs-splash { display: none; }

      /* ===== Splash "Ensamblar": el spinner barre detrás y las 2 mitades forman el favicon ===== */
      @property --deg { syntax: "<angle>";      initial-value: 0deg; inherits: true; }
      @property --p   { syntax: "<percentage>";  initial-value: 0%;   inherits: true; }
      @property --lw  { syntax: "<length>";      initial-value: 12px; inherits: true; }

      #nyxs-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        /* Mismo fondo que la interfaz (tema oscuro): --bg-0 #1f1e1d */
        background:
          radial-gradient(1000px 600px at 50% 0%, #2a2a28 0%, transparent 65%),
          #1f1e1d;
        opacity: 1; transition: opacity .45s ease;
      }
      #nyxs-splash.nyxs-hide { opacity: 0; pointer-events: none; }

      #nyxs-splash .stage { position: relative; width: 140px; height: 140px; display: grid; place-items: center; }
      #nyxs-splash .spin-wrap, #nyxs-splash .logo-wrap {
        position: absolute; inset: 0; display: grid; place-items: center;
      }
      #nyxs-splash .spinner {
        --size: 104px; --color: #fdb022; --color-2: #863bff; --color-3: #2dc5e8;
        width: var(--size); aspect-ratio: 1; border-radius: 50%;
        background: conic-gradient(from var(--deg), var(--color), var(--color-2), var(--color-3), transparent var(--p));
        -webkit-mask: radial-gradient(circle, transparent calc(var(--size)/2 - var(--lw)), #000 calc(var(--size)/2 - var(--lw)));
                mask: radial-gradient(circle, transparent calc(var(--size)/2 - var(--lw)), #000 calc(var(--size)/2 - var(--lw)));
        filter: drop-shadow(0 0 12px var(--color-3));
        animation:
          nyxs-rotate 1.1s ease infinite,
          nyxs-lw 3.3s ease infinite,
          nyxs-sweep 1.9s ease forwards;
      }
      #nyxs-splash .logo-wrap img {
        position: absolute; width: 96px; height: 96px; image-rendering: -webkit-optimize-contrast;
      }
      #nyxs-splash .half-o { clip-path: polygon(0 0,100% 0,100% 100%); animation: nyxs-asmO 1.9s cubic-bezier(.3,1.2,.5,1) forwards; }
      #nyxs-splash .half-c { clip-path: polygon(0 0,100% 100%,0 100%); animation: nyxs-asmC 1.9s cubic-bezier(.3,1.2,.5,1) forwards; }

      #nyxs-splash .label {
        margin-top: -8px; text-align: center;
        font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; letter-spacing: 4px;
        text-transform: uppercase; color: #ececec; opacity: 0; animation: nyxs-label 1.9s ease forwards;
      }

      @keyframes nyxs-rotate { from{--p:20%} 50%{--p:50%} 70%{--p:30%} 90%{--p:10%} to{--p:20%; --deg:-360deg} }
      @keyframes nyxs-lw { from,20%,70%,to{--lw:12px} 50%{--lw:2px} }

      @keyframes nyxs-sweep {
        0%{opacity:0; transform:scale(1)} 6%{opacity:1} 44%{opacity:1} 60%{opacity:0; transform:scale(1.2)} 100%{opacity:0}
      }
      @keyframes nyxs-asmO {
        0%,40%{opacity:0; transform:translate(40px,-40px) rotate(38deg)}
        66%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:1; transform:none}
      }
      @keyframes nyxs-asmC {
        0%,40%{opacity:0; transform:translate(-40px,40px) rotate(-38deg)}
        66%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:1; transform:none}
      }
      @keyframes nyxs-label { 0%,55%{opacity:0} 80%,100%{opacity:.45} }

      @media (prefers-reduced-motion: reduce) {
        #nyxs-splash .spinner { animation: none; opacity: 0; }
        #nyxs-splash .half-o, #nyxs-splash .half-c, #nyxs-splash .label { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <script>
      if (window.__TAURI_INTERNALS__?.metadata?.currentWindow?.label === "quick") document.documentElement.classList.add("nyxs-quick");
    </script>
    <div id="nyxs-splash">
      <div class="stage">
        <div class="spin-wrap"><div class="spinner"></div></div>
        <div class="logo-wrap">
          <img class="half-o" src="/logo.png" alt="" />
          <img class="half-c" src="/logo.png" alt="" />
        </div>
      </div>
      <div class="label">Nyxs</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
