name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `tsc -b` typechecks tsconfig.app.json and tsconfig.node.json, then `vite build` bundles:
      # the same command the release runs, so a broken bundle fails here instead of there.
      - name: Typecheck and build
        run: npm run build

      - name: Tests
        run: node node_modules/vitest/vitest.mjs run

      - name: Lint
        run: npm run lint

  e2e:
    # The frontend in Chromium against a fake Tauri backend and a scripted model (e2e/).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc -p tsconfig.e2e.json --noEmit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  rust:
    # Windows is the main platform and most `cfg(windows)` code (PowerShell host, job objects,
    # keep-awake) only compiles there; Linux keeps the other side of those cfgs honest, and macOS
    # builds its own native side (computer use) against the real SDK.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # A stuck package mirror fails the job instead of holding it for hours.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # First, so a formatting slip fails in seconds instead of after the build. No rustfmt.toml:
      # the defaults apply.
      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cache cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      # Cached between runs: downloading the ~200 WebKit/GTK packages from the Ubuntu mirror on
      # every run took from under a minute to over ten, depending on the mirror. Bump `version` to
      # refresh the cache.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1

      - name: Placeholder frontend bundle
        shell: bash
        run: mkdir -p dist

      # Clippy compiles every target, so it also covers what `cargo check` did.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # The MCP host tests spawn `node` on a fixture; both runner images ship it.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib --locked

  remote:
    # The SSH helper (src-tauri/remote, `nyxs-remote`) is its own Cargo workspace, so the `rust`
    # job never builds it. Every OS, since its watcher has per-OS code (FSEvents paths on macOS,
    # ReadDirectoryChangesW checks on Windows) and the release ships it for all three.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri/remote
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rustfmt
        run: cargo fmt --check

      - name: Cache cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri/remote -> target"

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
